<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>创作者抓取工具</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="title-row">
        <h1>graph-server</h1>
        <button id="mailBtn" class="mail-btn" type="button" title="查看申请收录消息" aria-label="查看申请收录消息"><span class="mail-icon">&#9993;</span>
          <span id="mailDot" class="mail-dot" hidden></span>
        </button>
      </div>
      <p class="sub">切换分区查看数据 · 三个分区独立配置抓取 · 数据只进不出</p>
    </div>
    <button id="openVisual" class="btn-visual">打开创作者星图 ↗</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <section class="panel" id="viewer">
    <div class="panel-head">
      <div>
        <h2 id="viewerTitle">数据总览</h2>
        <span class="muted" id="viewerMeta"></span>
      </div>
      <input type="search" id="find" placeholder="搜索作者名字 / UID" autocomplete="off">
    </div>
    <div class="summary" id="summary"></div>
    <div class="cols">
      <div>
        <h3>作者（按投稿数）</h3>
        <div id="creatorList" class="list"></div>
      </div>
      <div>
        <h3>合作关系（按次数）</h3>
        <div id="edgeList" class="list"></div>
      </div>
    </div>
  </section>

  <h2 class="section-title">抓取控制</h2>
  <div id="cards"></div>

  <section class="panel" id="onlinePanel">
    <div class="panel-head">
      <h2>联网搜索</h2>
      <span class="muted">按名字搜 B 站 UP · 看作品与粉丝</span>
    </div>
    <div id="renderProgress" class="render-progress" hidden>
      <div class="rp-top"><span id="rpPhase">准备中…</span><span id="rpPct">0%</span></div>
      <div class="progress"><i id="rpBar"></i></div>
    </div>
    <div class="on-layout">
      <div class="on-main">
        <div class="on-search">
          <input type="search" id="onKw" placeholder="输入 UP 主名字，回车搜索" autocomplete="off">
          <button id="onSearchBtn" class="btn-run">搜索</button>
        </div>
        <div id="onResults" class="on-results"></div>
        <div id="onWorks" class="on-works"></div>
      </div>
      <aside class="pending-side" id="pendingSide">
        <div class="pd-head">
          <button id="btnRender" class="btn-render" type="button" title="把已加入分区的 UP 并入图谱并重算布局">重新渲染</button>
          <b>待渲染名单</b>
          <span id="pendingCount" class="badge">空</span>
        </div>
        <p class="pd-tip">点「重新渲染」后，名单里的人会并入对应分区的图谱。</p>
        <div id="pendingNote" class="pd-note"></div>
        <div id="pendingList" class="pending-list"><div class="empty">暂无待渲染的 UP</div></div>
      </aside>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>抓取历史 <span id="historyTopic" class="muted"></span></h2>
      <span id="historyCount" class="muted"></span>
    </div>
    <div id="history" class="history"></div>
  </section>

  <footer>
    <span>数据文件：<code>data/bedrock.json</code> · <code>data/java.json</code> · <code>data/create.json</code></span>
    <span>只用 B 站公开接口，低频抓取，请勿商用</span>
  </footer>
</div>

<div id="logModal" class="log-modal" hidden>
  <div class="log-box">
    <div class="log-head">
      <div class="log-title">
        <b>抓取实时日志</b>
        <span id="logTopic" class="muted"></span>
        <span id="logStatus" class="badge">空闲</span>
      </div>
      <button id="logClose" class="log-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="logProgress" class="log-progress"></div>
    <div id="logBody" class="log-body"></div>
    <div class="log-foot">
      <span id="logCount" class="muted"></span>
      <button id="logClear" class="btn-save" type="button">清空显示</button>
    </div>
  </div>
</div>

<div id="mailModal" class="log-modal" hidden>
  <div class="mail-panel">
    <div class="log-head">
      <b>申请收录消息</b>
      <span id="mailCount" class="muted"></span>
      <button id="mailClose" class="log-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="mail-acts">
      <button id="mailAllRead" class="btn-save" type="button">一键已读</button>
      <button id="mailAllUnread" class="btn-save" type="button">一键未读</button>
      <button id="mailRefresh" class="btn-save" type="button">刷新</button>
    </div>
    <div id="mailList" class="mail-list"></div>
  </div>
</div>

<div id="addToTopicModal" class="log-modal" hidden>
  <div class="mail-panel">
    <div class="log-head">
      <b>加入分区</b>
      <span id="addToName" class="muted"></span>
      <button id="addToClose" class="log-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div id="addToTopics" class="addto-topics"></div>
    <div class="mail-acts">
      <button id="addToCancel" class="btn-save" type="button">取消</button>
      <button id="addToConfirm" class="btn-run" type="button">确定</button>
    </div>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
